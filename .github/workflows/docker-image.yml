name: Build and publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: tinode-${{ matrix.db }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for `git describe --tags`

      - name: Compute build info
        id: info
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/tinode-${{ matrix.db }}" >> "$GITHUB_OUTPUT"
          echo "buildstamp=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          echo "version=${last_tag#v}" >> "$GITHUB_OUTPUT"

      # QEMU is only used for the small runtime stage (apk add, chmod);
      # Go binaries are cross-compiled natively in the builder stage.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.info.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # docker-bake.hcl builds the upstream docker/tinode/Dockerfile as the base and
      # docker/tinode/Dockerfile.source on top of it.
      - name: Build and push
        uses: docker/bake-action@v6
        env:
          TARGET_DB: ${{ matrix.db }}
          VERSION: ${{ steps.info.outputs.version }}
          BUILDSTAMP: ${{ steps.info.outputs.buildstamp }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: tinode
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            upstream.cache-from=type=gha,scope=upstream-${{ matrix.db }}
            upstream.cache-to=type=gha,mode=max,scope=upstream-${{ matrix.db }}
            tinode.cache-from=type=gha,scope=tinode-${{ matrix.db }}
            tinode.cache-to=type=gha,mode=max,scope=tinode-${{ matrix.db }}
