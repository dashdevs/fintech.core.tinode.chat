name: Build and publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: tinode-${{ matrix.db }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for `git describe --tags`

      - name: Compute build info
        id: info
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/tinode-${{ matrix.db }}" >> "$GITHUB_OUTPUT"
          echo "buildstamp=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          echo "version=${last_tag#v}" >> "$GITHUB_OUTPUT"

      # QEMU is only used for the small runtime stage (apk add, chmod);
      # Go binaries are cross-compiled natively in the builder stage.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.info.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tinode/Dockerfile.source
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGET_DB=${{ matrix.db }}
            VERSION=${{ steps.info.outputs.version }}
            BUILDSTAMP=${{ steps.info.outputs.buildstamp }}
          cache-from: type=gha,scope=tinode-${{ matrix.db }}
          cache-to: type=gha,mode=max,scope=tinode-${{ matrix.db }}
